<!doctype html>
<html><head><meta charset="utf-8">
<!-- Motion graphics that illustrate what's being said (no card background).
     kinds: stamp, keyword, pin, calendar, stopwatch, wind, spotlight, poll, padlock, subscription, tv, flow, bubbles, birthday, podcast -->
<style>
  :root { --acc: #E8231E; --acc2: #FFE11A; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; }
  .t-anton { font-family: 'Anton'; } .t-bebas { font-family: 'Bebas'; }
  .t-mb { font-family: 'MontB'; } .t-meb { font-family: 'MontEB'; }
  .shadow { filter: drop-shadow(0 18px 30px rgba(0,0,0,.55)) drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
</style></head>
<body><div id="root"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eOut = x => 1 - Math.pow(1 - clamp(x), 3);
const eOutExpo = x => (x = clamp(x)) >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInOut = x => (x = clamp(x)) < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = (x, c = 1.7) => { x = clamp(x); return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const eElastic = x => { x = clamp(x); return x === 0 || x === 1 ? x : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1; };
let S, R = {};
const $ = id => document.getElementById(id);
const fadeOut = t => 1 - clamp((t - (S.dur - .3)) / .3);

function fonts(dir) {
  const f = (fam, file) => `@font-face{font-family:'${fam}';src:url('file://${dir}/${file}')}`;
  return f('Anton', 'Anton-Regular.ttf') + f('Bebas', 'BebasNeue-Regular.ttf') + f('MontB', 'Montserrat-Black.ttf') + f('MontEB', 'Montserrat-ExtraBold.ttf');
}

const BUILD = {
  // big rubber-stamp slam, e.g. "FRAUD?"
  stamp() {
    R.w = 960; R.h = 460;
    return `<div id="st" class="shadow" style="position:absolute;left:480px;top:230px;transform-origin:center">
      <div style="transform:translate(-50%,-50%) rotate(${S.angle ?? -8}deg);border:12px solid var(--acc);border-radius:22px;padding:18px 44px 8px;
        background:rgba(0,0,0,.18);-webkit-mask-image:radial-gradient(circle at 30% 40%, #000 60%, rgba(0,0,0,.82) 61%, #000 70%);">
        <div class="t-anton" style="font-size:${S.size || 170}px;line-height:1;color:var(--acc);letter-spacing:.02em;white-space:nowrap">${S.text}</div>
        ${S.sub ? `<div class="t-mb" style="font-size:34px;color:var(--acc);text-align:center;letter-spacing:.2em;margin:6px 0 10px">${S.sub}</div>` : ''}
      </div></div>`;
  },
  // kinetic keyword: letters drop in with stagger
  keyword() {
    R.w = 1000; R.h = 360;
    const words = S.text.split(' ');
    return `<div class="shadow" style="position:absolute;left:0;top:0;width:1000px;height:360px;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap">
      ${words.map((w, i) => `<span id="kw${i}" class="t-anton" style="display:inline-block;font-size:${S.size || 150}px;line-height:1;
        color:${i === (S.hi ?? words.length - 1) ? 'var(--acc2)' : '#fff'};-webkit-text-stroke:6px #000;paint-order:stroke fill">${w}</span>`).join('')}</div>`;
  },
  // location pin drop + ripple + label
  pin() {
    R.w = 900; R.h = 620;
    return `<svg width="900" height="520" style="position:absolute;left:0;top:0;overflow:visible">
      <ellipse id="rp" cx="450" cy="300" rx="0" ry="0" fill="none" stroke="var(--acc)" stroke-width="5"/>
      <ellipse cx="450" cy="300" rx="38" ry="12" fill="rgba(0,0,0,.45)" id="pinsh"/>
      <g id="pin" class="shadow"><path d="M450 300 C 420 250, 385 222, 385 180 a65 65 0 1 1 130 0 C 515 222, 480 250, 450 300 Z" fill="var(--acc)"/>
        <circle cx="450" cy="180" r="26" fill="#fff"/></g></svg>
      <div id="pl" class="shadow" style="position:absolute;left:0;width:900px;top:340px;text-align:center">
        <div class="t-anton" style="font-size:110px;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill">${S.text}</div>
        ${S.sub ? `<div class="t-mb" style="font-size:34px;color:#fff;letter-spacing:.14em;margin-top:6px">${S.sub}</div>` : ''}</div>`;
  },
  // month chips flip in; highlighted ones glow
  calendar() {
    const n = S.items.length; R.w = Math.max(960, n * 230 + 80); R.h = 420;
    return `<div class="shadow" style="position:absolute;left:0;top:0;width:${R.w}px;display:flex;justify-content:center;gap:26px;perspective:900px;padding-top:30px">
      ${S.items.map((m, i) => `<div id="cal${i}" style="width:200px;border-radius:26px;overflow:hidden;background:#15161c;border:2px solid rgba(255,255,255,.12);transform-origin:50% 0">
        <div style="height:52px;background:${(S.hi || []).includes(i) ? 'var(--acc)' : '#2a2c35'}"></div>
        <div class="t-anton" style="font-size:96px;color:#fff;text-align:center;padding:18px 0 24px">${m}</div></div>`).join('')}</div>
      ${S.label ? `<div id="calL" class="t-mb shadow" style="position:absolute;left:0;width:${R.w}px;top:330px;text-align:center;font-size:38px;color:#fff;letter-spacing:.06em;white-space:nowrap">${S.label}</div>` : ''}`;
  },
  // stopwatch: hand sweeps, digits count to value
  stopwatch() {
    R.w = 900; R.h = 620;
    const ticks = Array.from({ length: 60 }, (_, i) => { const a = i / 60 * 2 * Math.PI, r1 = i % 5 ? 196 : 182;
      return `<line x1="${260 + Math.sin(a) * r1}" y1="${300 - Math.cos(a) * r1}" x2="${260 + Math.sin(a) * 210}" y2="${300 - Math.cos(a) * 210}" stroke="rgba(255,255,255,${i % 5 ? .35 : .9})" stroke-width="${i % 5 ? 3 : 6}"/>`; }).join('');
    return `<svg width="520" height="560" style="position:absolute;left:0;top:30px" class="shadow">
      <rect x="235" y="40" width="50" height="40" rx="8" fill="#2a2c35"/><rect x="215" y="22" width="90" height="26" rx="10" fill="var(--acc)"/>
      <circle cx="260" cy="300" r="225" fill="#111218" stroke="#2a2c35" stroke-width="10"/>${ticks}
      <circle id="swArc" cx="260" cy="300" r="150" fill="none" stroke="var(--acc)" stroke-width="16" stroke-linecap="round" transform="rotate(-90 260 300)"
        stroke-dasharray="${2 * Math.PI * 150}" stroke-dashoffset="${2 * Math.PI * 150}" opacity=".9"/>
      <line id="hand" x1="260" y1="300" x2="260" y2="110" stroke="var(--acc2)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="260" cy="300" r="16" fill="var(--acc2)"/></svg>
      <div class="shadow" style="position:absolute;left:520px;top:180px">
        <div id="swN" class="t-anton" style="font-size:190px;line-height:.9;color:#fff">${S.format === 'mss' ? '0:00' : '0.0'}</div>
        <div class="t-bebas" style="font-size:80px;color:var(--acc)">${S.unit || 'SECONDS'}</div>
        ${S.label ? `<div class="t-meb" style="font-size:30px;color:rgba(255,255,255,.75);letter-spacing:.14em;margin-top:8px">${S.label}</div>` : ''}</div>`;
  },
  // wind streaks flowing + label
  wind() {
    R.w = 1080; R.h = 420;
    let lines = '';
    for (let i = 0; i < 9; i++) { const y = 40 + i * 38 + (i % 2) * 10;
      lines += `<path id="wl${i}" d="M -200 ${y} C 150 ${y - 30}, 350 ${y + 30}, 620 ${y} S 1000 ${y - 26}, 1280 ${y}" fill="none" stroke="rgba(255,255,255,${.55 + (i % 3) * .15})" stroke-width="${5 + (i % 3) * 3}" stroke-linecap="round" stroke-dasharray="360 1300"/>`; }
    return `<svg width="1080" height="400" style="position:absolute;left:0;top:0">${lines}</svg>
      <div id="wlab" class="shadow" style="position:absolute;left:0;top:300px;width:1080px;text-align:center">
        <span class="t-anton" style="font-size:96px;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill">${S.text || 'WIND-AIDED'}</span></div>`;
  },
  // circle draws around a subject on the full 1080x1920 frame + arrow + label
  spotlight() {
    R.w = 1080; R.h = 1920; R.full = true;
    const { x, y } = S, r = S.r || 170, lx = S.lx ?? (x > 540 ? x - 420 : x + 120), ly = S.ly ?? (y + r + 170);
    const C = 2 * Math.PI * r;
    return `<svg width="1080" height="1920" style="position:absolute;left:0;top:0" class="shadow">
      <circle id="spC" cx="${x}" cy="${y}" r="${r}" fill="none" stroke="var(--acc2)" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-120 ${x} ${y})"/>
      <path id="spA" d="M ${lx + 150} ${ly - 30} Q ${(lx + 150 + x) / 2 + 60} ${(ly + y) / 2 + 40}, ${x + (lx < x ? -r : r) * .55} ${y + r * .9}" fill="none" stroke="var(--acc2)" stroke-width="10" stroke-linecap="round"/>
      </svg>
      <div id="spL" class="shadow" style="position:absolute;left:${lx}px;top:${ly}px">
        <div class="t-anton" style="font-size:84px;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill;white-space:nowrap">${S.text}</div>
        ${S.sub ? `<div class="t-mb" style="font-size:32px;color:var(--acc2);letter-spacing:.12em">${S.sub}</div>` : ''}</div>`;
  },
  // comment-bait poll: question + two options that pulse, no fake percentages
  poll() {
    R.w = 960; R.h = 560;
    return `<div class="shadow" style="position:absolute;left:30px;top:20px;width:900px">
      <div id="pq" class="t-anton" style="font-size:96px;line-height:1.02;color:#fff;text-align:center;-webkit-text-stroke:5px #000;paint-order:stroke fill">${S.question}</div>
      <div style="display:flex;gap:28px;margin-top:34px">${S.options.map((o, i) => `<div id="po${i}" style="flex:1;border-radius:28px;padding:30px 0;text-align:center;
          background:${i ? 'var(--acc)' : '#fff'};color:${i ? '#fff' : '#111'}"><span class="t-anton" style="font-size:78px">${o}</span></div>`).join('')}</div>
      <div id="pc" class="t-mb" style="text-align:center;font-size:36px;color:#fff;letter-spacing:.16em;margin-top:28px">${S.cta || 'COMMENT BELOW ⬇'}</div></div>`;
  },
  // podcast clip on screen: mic badge + live waveform + who's talking
  podcast() {
    R.w = 1000; R.h = 300;
    const bars = Array.from({ length: 22 }, (_, i) => `<rect id="pb${i}" x="${i * 22}" y="0" width="12" height="10" rx="6" fill="${i % 2 ? 'var(--acc2)' : '#fff'}"/>`).join('');
    return `<div id="pcw" class="shadow" style="position:absolute;left:40px;top:30px;width:920px;height:230px;border-radius:34px;background:rgba(14,15,20,.86);border:3px solid rgba(255,255,255,.14)">
      <div id="pmic" style="position:absolute;left:28px;top:28px;width:174px;height:174px;border-radius:50%;background:var(--acc)">
        <svg width="174" height="174" viewBox="0 0 174 174"><rect x="66" y="34" width="42" height="72" rx="21" fill="#fff"/>
          <path d="M50 88 a37 37 0 0 0 74 0" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
          <line x1="87" y1="125" x2="87" y2="144" stroke="#fff" stroke-width="9" stroke-linecap="round"/></svg></div>
      <div style="position:absolute;left:232px;top:26px">
        <div class="t-meb" style="font-size:28px;letter-spacing:.24em;color:var(--acc2)"><span id="pdot" style="display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--acc);margin-right:12px;vertical-align:2px"></span>${S.tag || 'ON A PODCAST'}</div>
        <div class="t-anton" style="font-size:92px;line-height:1.05;color:#fff;white-space:nowrap">${S.text}</div></div>
      <svg width="480" height="40" style="position:absolute;left:236px;top:176px;overflow:visible">${bars}</svg></div>`;
  },

  // padlock slams shut over a screen showing the sport, "PAYWALL" text
  padlock() {
    R.w = 960; R.h = 700;
    return `<div style="position:absolute;left:180px;top:40px;width:600px;height:360px;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,#1b3b8f,#0e1a3d);border:3px solid rgba(255,255,255,.15)" class="shadow">
        <svg width="600" height="360"><g opacity=".9">${Array.from({length:6},(_,i)=>`<path d="M -20 ${330-i*26} Q 300 ${200-i*30} 620 ${330-i*26}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="4"/>`).join('')}</g>
          <text x="300" y="120" text-anchor="middle" font-family="Anton" font-size="70" fill="#fff">${S.screen || 'TRACK & FIELD'}</text></svg>
        <div id="pwDim" style="position:absolute;inset:0;background:rgba(0,0,0,.0)"></div></div>
      <svg id="lock" width="300" height="360" style="position:absolute;left:330px;top:170px;overflow:visible" class="shadow">
        <path id="shackle" d="M 80 150 V 95 a 70 70 0 0 1 140 0 V 150" fill="none" stroke="#d9dde6" stroke-width="30" stroke-linecap="round"/>
        <rect x="40" y="140" width="220" height="180" rx="30" fill="var(--acc)"/>
        <circle cx="150" cy="215" r="22" fill="#111"/><rect x="141" y="225" width="18" height="48" rx="8" fill="#111"/></svg>
      <div id="pwT" class="t-anton shadow" style="position:absolute;left:0;width:960px;top:540px;text-align:center;font-size:120px;color:#fff;-webkit-text-stroke:6px #000;paint-order:stroke fill">${S.text || 'PAYWALL'}</div>`;
  },
  // streaming screen: "now streaming on A" -> card swaps to B -> SUBSCRIPTION REQUIRED
  subscription() {
    R.w = 960; R.h = 720;
    return `<div id="phone" class="shadow" style="position:absolute;left:180px;top:20px;width:600px;height:680px;border-radius:48px;background:#0c0d12;border:6px solid #2a2c35;overflow:hidden">
        <div class="t-meb" style="color:rgba(255,255,255,.6);font-size:28px;letter-spacing:.14em;text-align:center;margin-top:46px">${S.event || 'DIAMOND LEAGUE'}</div>
        <div id="cardA" style="position:absolute;left:50px;right:50px;top:120px;height:200px;border-radius:28px;background:linear-gradient(135deg,#2b2f3d,#171922);display:flex;align-items:center;justify-content:center">
          <span class="t-anton" style="font-size:84px;color:#fff">${S.from}</span></div>
        <div id="cardB" style="position:absolute;left:50px;right:50px;top:120px;height:200px;border-radius:28px;background:linear-gradient(135deg,var(--acc),#7a0f0c);display:flex;align-items:center;justify-content:center">
          <span class="t-anton" style="font-size:84px;color:#fff">${S.to}</span></div>
        <div id="lockRow" style="position:absolute;left:30px;right:30px;top:350px;text-align:center">
          <svg width="90" height="110" viewBox="0 0 300 360"><path d="M 80 150 V 95 a 70 70 0 0 1 140 0 V 150" fill="none" stroke="#d9dde6" stroke-width="30"/><rect x="40" y="140" width="220" height="180" rx="30" fill="var(--acc)"/></svg>
          <div class="t-anton" style="font-size:52px;color:#fff;line-height:1.05;white-space:nowrap;margin-top:8px">SUBSCRIPTION REQUIRED</div></div>
        <div id="btn" style="position:absolute;left:90px;right:90px;bottom:50px;height:90px;border-radius:45px;background:#fff;display:flex;align-items:center;justify-content:center">
          <span class="t-mb" style="font-size:30px;color:#111;letter-spacing:.04em;white-space:nowrap">${S.button || 'SUBSCRIBE TO WATCH'}</span></div></div>`;
  },
  // TV switches on: static burst -> picture of a track -> label
  tv() {
    R.w = 960; R.h = 700;
    return `<div class="shadow" style="position:absolute;left:110px;top:30px;width:740px;height:500px">
        <div style="position:absolute;inset:0;border-radius:36px;background:#15161c;border:6px solid #2a2c35"></div>
        <div id="scr" style="position:absolute;left:34px;top:34px;right:34px;bottom:34px;border-radius:18px;overflow:hidden;background:#000">
          <svg id="trk" width="672" height="432" style="position:absolute;left:0;top:0;opacity:0"><rect width="672" height="432" fill="#1d6b3a"/>
            <ellipse cx="336" cy="216" rx="330" ry="190" fill="#b5462f"/><ellipse cx="336" cy="216" rx="250" ry="120" fill="#1d6b3a"/>
            ${Array.from({length:5},(_,i)=>`<ellipse cx="336" cy="216" rx="${330-i*16}" ry="${190-i*14}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>`).join('')}
            <rect x="18" y="18" width="110" height="44" rx="8" fill="var(--acc)"/><text x="73" y="50" text-anchor="middle" font-family="Anton" font-size="30" fill="#fff">LIVE</text></svg>
          <canvas id="noise" width="168" height="108" style="position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated"></canvas>
          <div id="line" style="position:absolute;left:0;right:0;top:50%;height:6px;background:#fff;transform-origin:center"></div></div>
        <div style="position:absolute;left:300px;top:500px;width:140px;height:60px;background:#2a2c35;border-radius:0 0 18px 18px"></div></div>
      <div id="tvT" class="t-anton shadow" style="position:absolute;left:0;width:960px;top:590px;text-align:center;font-size:96px;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill">${S.text || 'ON TV, FOR FREE'}</div>`;
  },
  // eyes -> attention -> money: three icons light up in sequence with arrows (no fake numbers)
  flow() {
    R.w = 1000; R.h = 520;
    const items = S.items || ['FREE TO WATCH', 'MORE EYES', 'MORE MONEY'];
    const icons = [
      `<svg width="150" height="150" viewBox="0 0 100 100"><rect x="14" y="22" width="72" height="48" rx="8" fill="none" stroke="#fff" stroke-width="7"/><path d="M44 36 L60 46 L44 56 Z" fill="var(--acc2)"/><rect x="38" y="76" width="24" height="7" rx="3" fill="#fff"/></svg>`,
      `<svg width="150" height="150" viewBox="0 0 100 100"><path d="M8 50 Q50 10 92 50 Q50 90 8 50 Z" fill="none" stroke="#fff" stroke-width="7"/><circle cx="50" cy="50" r="15" fill="var(--acc2)"/></svg>`,
      `<svg width="150" height="150" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="7"/><text x="50" y="68" text-anchor="middle" font-family="Anton" font-size="52" fill="var(--acc2)">$</text></svg>`];
    return `<div style="position:absolute;left:0;top:30px;width:1000px;display:flex;justify-content:space-between;align-items:flex-start">
      ${items.map((t, i) => `<div id="fl${i}" class="shadow" style="width:300px;text-align:center">${icons[i % 3]}
        <div class="t-anton" style="font-size:62px;line-height:1.02;color:#fff;-webkit-text-stroke:4px #000;paint-order:stroke fill;margin-top:8px">${t}</div></div>`).join('')}</div>
      ${[0,1].map(i => `<svg id="ar${i}" width="90" height="60" style="position:absolute;left:${300 + i*335 - 30}px;top:95px" class="shadow"><path d="M5 30 H70 M50 10 L75 30 L50 50" fill="none" stroke="var(--acc2)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>`).join('')}`;
  },
  // chat bubbles pop in (generic, illustrative reactions)
  bubbles() {
    R.w = 1000; R.h = 680;
    const L = S.items || ['PAYWALL AGAIN?!', 'WHERE CAN I EVEN WATCH THIS', 'ANOTHER SUBSCRIPTION?', 'TRACK IS DYING'];
    const pos = [[40, 30], [260, 170], [60, 330], [380, 480], [120, 560]];
    return L.map((t, i) => `<div id="bb${i}" class="shadow" style="position:absolute;left:${pos[i % 5][0]}px;top:${pos[i % 5][1]}px;max-width:640px;padding:22px 34px;border-radius:34px;
        background:${i % 2 ? '#fff' : '#1f2230'};color:${i % 2 ? '#111' : '#fff'};border-bottom-${i % 2 ? 'right' : 'left'}-radius:8px">
        <span class="t-mb" style="font-size:44px;letter-spacing:.01em">${t}</span></div>`).join('');
  },
  // birthday cake: number candles light up, confetti burst, "HAPPY BIRTHDAY" + name
  birthday() {
    R.w = 1000; R.h = 900;
    const num = String(S.number ?? '');
    const conf = Array.from({ length: 46 }, (_, i) => { const r = k => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
      const c = ['var(--acc)', 'var(--acc2)', '#fff', '#3fa9f5', '#2ecc71'][i % 5];
      return `<div id="cf${i}" data-a="${(r(1) * 2 - 1) * 1.25}" data-v="${560 + r(2) * 520}" data-s="${r(3) * 720 - 360}" style="position:absolute;left:500px;top:330px;width:${14 + r(4) * 12}px;height:${8 + r(5) * 8}px;background:${c};border-radius:2px;opacity:0"></div>`; }).join('');
    const digits = num.split('').map((d, i) => `<div style="position:relative;width:110px;text-align:center">
        <div id="fl${i}" style="position:absolute;left:41px;top:-62px;width:28px;height:50px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
          background:radial-gradient(circle at 50% 70%, #fff 0 18%, var(--acc2) 40%, #ff8a00 75%, transparent 76%);opacity:0;transform-origin:50% 100%;filter:drop-shadow(0 0 18px #ffb300)"></div>
        <div style="position:absolute;left:53px;top:-14px;width:4px;height:16px;background:#222"></div>
        <div class="t-anton" style="font-size:150px;line-height:1;color:var(--acc2);-webkit-text-stroke:6px #000;paint-order:stroke fill">${d}</div></div>`).join('');
    return `<div id="cake" class="shadow" style="position:absolute;left:200px;top:120px;width:600px;height:470px;transform-origin:50% 100%">
        <div style="position:absolute;left:0;right:0;top:34px;display:flex;justify-content:center;gap:6px">${digits}</div>
        <div style="position:absolute;left:110px;width:380px;top:180px;height:120px;border-radius:22px 22px 10px 10px;background:linear-gradient(#fff6e8,#f1d9b5)"></div>
