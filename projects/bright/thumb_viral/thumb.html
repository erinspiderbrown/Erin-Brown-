<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url('file:///home/user/Erin-Brown-/editor/assets/fonts/Anton-Regular.ttf')}
html,body{margin:0;background:#000}
#c{position:relative;overflow:hidden;background:#000}
.t{position:absolute;left:0;right:0;text-align:center;font-family:Anton;line-height:.92;letter-spacing:2px;text-transform:uppercase}
.g{color:#8DF02A;text-shadow:0 0 18px rgba(141,240,42,.55),0 6px 0 rgba(0,0,0,.6)}
.w{color:#fff;text-shadow:0 0 22px #fff,0 0 60px rgba(255,255,255,.7),0 8px 0 rgba(0,0,0,.5)}
#subj{position:absolute;filter:contrast(1.1) saturate(1.1) brightness(1.08)}
#pol{position:absolute;background:#fff;padding:16px 16px 54px;box-shadow:0 18px 40px rgba(0,0,0,.85);transform:rotate(-9deg)}
#pol img{display:block}
</style></head><body><div id="c"></div>
<script>
// layout JSON in the URL hash: W,H, lines [{text, cls:'g'|'w', top, size}], subject {src, left, top, width, mask}, polaroid {src, left, top, width, rot}
const L = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const c = document.getElementById('c'); c.style.width = L.W + 'px'; c.style.height = L.H + 'px';
const s = L.subject, p = L.polaroid;
c.innerHTML = `<img id="subj" src="${s.src}" style="left:${s.left}px;top:${s.top}px;width:${s.width}px;-webkit-mask-image:${s.mask};mask-image:${s.mask}">`
  + L.lines.map(l => `<div class="t ${l.cls}" style="top:${l.top}px;font-size:${l.size}px">${l.text}</div>`).join('')
  + (p ? `<div id="pol" style="left:${p.left}px;top:${p.top}px;transform:rotate(${p.rot || -9}deg)"><img src="${p.src}" style="width:${p.width}px"></div>` : '');
</script></body></html>
