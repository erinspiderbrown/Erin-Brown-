<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000}
#c{position:relative;overflow:hidden}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.12) contrast(1.05) brightness(1.04) sepia(.06)}
.bub{position:absolute;border-radius:50%;border:16px solid #E8231E;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45);background:#000}
.bub img{width:100%;height:100%;object-fit:cover}
.tail{position:absolute;width:0;height:0;border-left:34px solid transparent;border-right:34px solid transparent;border-top:90px solid #E8231E;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
</style></head><body><div id="c"></div><script>
const L=JSON.parse(decodeURIComponent(location.hash.slice(1)));const c=document.getElementById('c');c.style.width=L.W+'px';c.style.height=L.H+'px';
c.innerHTML=`<img class="ph" src="photo.jpg" style="object-position:${L.pos}">
<div class="tail" style="left:${L.tx}px;top:${L.ty}px;transform:rotate(${L.tr}deg)"></div>
<div class="bub" style="left:${L.bx}px;top:${L.by}px;width:${L.bd}px;height:${L.bd}px"><img src="obj.jpg" style="object-position:${L.opos}"></div>`;
</script></body></html>
